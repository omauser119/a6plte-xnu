name: A6PLTE bring-up
on:
  push:
  pull_request:
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: bringup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  framebuffer-and-lk2nd:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang llvm lld device-tree-compiler gcc-arm-none-eabi libnewlib-arm-none-eabi ripgrep
      - run: python3 scripts/fetch-sources.py
      - run: ./scripts/test.sh
      - run: ./scripts/build-smoke.sh
      - run: ./scripts/build-lk2nd.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a6plte-boot-images
          path: |
            artifacts/*boot.img
            artifacts/lk2nd-a6plte-xnu.img
            artifacts/*.log
  xnu-apple-clang:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install bison flex tcsh
      - name: Select Apple compiler and SDK
        run: |
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "SDK=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          clang --version
      - run: python3 scripts/fetch-sources.py
      - name: Platform objects and MIG generation
        run: ./scripts/check-platform.sh 2>&1 | tee platform.log
      - name: Check OSFMK objects
        if: success()
        run: python3 scripts/check-component.py osfmk 2>&1 | tee osfmk.log
      - name: Check generated MIG objects
        if: always() && hashFiles('build/mig-generated/results.json') != ''
        run: python3 scripts/check-component.py mig 2>&1 | tee mig.log
      - name: Generate IOKit RPC interfaces
        run: python3 scripts/generate-iokit.py 2>&1 | tee iig.log
      - name: Build remaining kernel components
        if: always() && hashFiles('build/xnu/bsd/Makefile') != ''
        run: |
          failed=0
          for component in pexpert bsd libkern iokit libsa security san; do
            python3 scripts/check-component.py "$component" 2>&1 | tee "$component.log" || failed=1
          done
          exit "$failed"
      - name: Link XNU ARM64 executable
        run: python3 scripts/link-xnu.py 2>&1 | tee link.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-build-output
          path: |
            *.log
            artifacts/**/*.log
            artifacts/**/results.json
            artifacts/**/*.macho.o
            build/mig-generated/results.json
            artifacts/kernel.a6plte
            artifacts/link-command.txt
            build/xnu/iokit/**/*.h
            build/xnu/iokit/**/*.cpp

  package-xnu:
    needs: xnu-apple-clang
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang llvm lld device-tree-compiler
      - uses: actions/download-artifact@v4
        with:
          name: xnu-build-output
      - name: Package linked kernel for lk2nd
        run: ./scripts/package-boot.sh artifacts/kernel.a6plte
      - uses: actions/upload-artifact@v4
        with:
          name: xnu-boot-image
          path: artifacts/xnu-boot.img
